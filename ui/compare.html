<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FE01 · the sample page beside the prototype</title>
<link rel="stylesheet" href="/ui.css">
<script type="module">
  /* The tester's view: the kit's sample page (left) and the owner's prototype (right) in one theme, each at its own
     1440px width shown at half size. Needs the dev server started with HUB_PROTOTYPE (.env.example); without it the
     right side is empty. ?theme=light|dark chooses the theme of both; ?accent=RRGGBB the sample's accent;
     ?side=sample or ?side=prototype shows one of them alone (for a screenshot in a narrow window). */
  const q = new URLSearchParams(location.search);
  const theme = q.get("theme") === "dark" ? "dark" : "light";
  document.documentElement.dataset.theme = theme;
  document.getElementById("sample").src = `/?theme=${theme}${q.get("accent") ? `&accent=${q.get("accent")}` : ""}`;
  const proto = document.getElementById("prototype");
  proto.src = `/prototype/Components.dc.html?theme=${theme}`;
  // the prototype's page takes its theme as a design prop (data-props, default light); ?theme= only colours its
  // page background, so once its React tree is up, write the theme onto its .hub root as its own avatar menu does
  proto.addEventListener("load", () => {
    const paint = () => { const hub = proto.contentDocument?.querySelector(".hub"); if (hub) hub.dataset.theme = theme; };
    for (const ms of [0, 300, 1000, 2500]) setTimeout(paint, ms);
  });
  for (const a of document.querySelectorAll("[data-theme-link]")) a.setAttribute("aria-current", String(a.dataset.themeLink === theme));
  const side = q.get("side");
  if (side) for (const box of document.querySelectorAll("[data-side]")) box.hidden = box.dataset.side !== side;
</script>
</head>
<body class="bg-bg text-ink-1">
<div class="flex items-center gap-6 border-b border-line px-4 py-2 font-mono text-small uppercase tracking-caps text-ink-3">
  <span>FE01 · left: the kit's sample page · right: the prototype's Components page</span>
  <a data-theme-link="light" href="?theme=light" class="aria-[current=true]:text-accent-text">Light</a>
  <a data-theme-link="dark" href="?theme=dark" class="aria-[current=true]:text-accent-text">Dark</a>
</div>
<div class="flex gap-4 p-4">
  <div data-side="sample" class="h-325 w-180 shrink-0 overflow-hidden border border-line"><iframe id="sample" title="The kit's sample page" class="h-650 w-360 origin-top-left scale-50 border-0"></iframe></div>
  <div data-side="prototype" class="h-325 w-180 shrink-0 overflow-hidden border border-line"><iframe id="prototype" title="The prototype's Components page" class="h-650 w-360 origin-top-left scale-50 border-0"></iframe></div>
</div>
</body>
</html>
