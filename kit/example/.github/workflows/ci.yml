# The gate for a Brax Business App on the hub-module stack. Copied to .github/workflows/ci.yml by kit/init.mjs.
#   gate    typecheck, security scan, UI check, RLS test (PGlite), unit tests, build            on every push and PR
#   suites  the dev server with the stub edge, smoke (Edge), screenshots, the MCP path            needs gate
#   native  the RLS test and a built-and-started server on tinbase's native Postgres 17 (Linux)   needs gate
# Artefacts: screenshots and logs, kept 14 days.
# Needs the repository or organisation secret UI_KIT_TOKEN: a token that may read Brax-Hub/ui-kit (contents, read only),
# because package.json names the UI kit by its tag in that private repository and npm clones it.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  APP_ENV: local
  TINBASE_ENGINE: pglite

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env: # read access to the UI kit, which package.json names by tag (ui/README.md in Brax-Hub/ui-kit)
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Brax-Hub/ui-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/Brax-Hub/ui-kit
      - run: npm run gate
      - run: npm test

  suites:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env: # read access to the UI kit, which package.json names by tag (ui/README.md in Brax-Hub/ui-kit)
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Brax-Hub/ui-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/Brax-Hub/ui-kit
      - name: Edge for Playwright
        run: npx playwright-core install msedge
      - name: Dev server with the stub edge
        run: |
          mkdir -p dist/ci-logs
          (npm run dev > dist/ci-logs/dev.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf "http://localhost:3310/modules/example/healthz" >/dev/null && break; sleep 1; done
          curl -sf "http://localhost:3310/modules/example/healthz"
      # Screens first, on the freshly seeded database, so the smoke run's rows never appear in them.
      - run: npm run screens
      - run: npm run smoke
      - run: BASE_URL=http://localhost:3310/modules/example node --test tooling/mcp.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-and-logs
          path: |
            dist/screens
            dist/ci-logs
          retention-days: 14

  native:
    needs: gate
    runs-on: ubuntu-latest
    env:
      TINBASE_ENGINE: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env: # read access to the UI kit, which package.json names by tag (ui/README.md in Brax-Hub/ui-kit)
          GIT_CONFIG_COUNT: 2
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/Brax-Hub/ui-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.UI_KIT_TOKEN }}@github.com/Brax-Hub/ui-kit.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/Brax-Hub/ui-kit
      - name: Postgres 17 binaries (cached by tinbase under ~/.cache/tinbase)
        run: node -e "import('tinbase/node').then(m => m.ensurePostgres(undefined, undefined, console.log))"
      - run: npm run test-rls
      - run: npm run build
      - name: The built server answers 401 without the member and 200 with it
        run: |
          export JWT_SECRET=ci-only-secret-0123456789abcdef0123456789 APP_ENV=lab DATA_DIR=$RUNNER_TEMP/data PORT=8080
          (npm start > native-server.log 2>&1 &)
          for i in $(seq 1 90); do curl -sf "http://localhost:8080/modules/example/healthz" >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/modules/example/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Brax-Member-Id: ci-owner' -H 'X-Brax-Member-Name: CI%20Owner' -H 'X-Brax-Member-Role: owner' http://localhost:8080/modules/example/)" = 200
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-server-log
          path: native-server.log
          retention-days: 14
