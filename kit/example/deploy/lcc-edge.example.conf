# The edge block for example until the generic /modules/<slug>/ ingress exists (HUB-SHELL.md section 8). Goes inside
# the hub's `server { listen 443 ssl; server_name _; ... }` block of lcc-edge-bridge.conf, modelled on the Vault
# block there (hub-bundle at origin/main, the /modules/vault/ location and /_vault_member).
#
# LCC names the acting member from the session (GET /internal/hub/member, lcc app/member_auth.py); nginx copies its
# answer onto the proxied request as X-Brax-Member-Id, X-Brax-Member-Name (percent-encoded) and X-Brax-Member-Role,
# and blanks the cookie, the Authorization header and anything a client sent in those names. The module trusts the
# headers because this is the only way in.
#
# nginx variable names cannot contain a hyphen, so variables and the internal location use example (the slug with
# underscores); the route, the service name and the network keep the slug as it is.

        # The MCP server is the tool gateway's, on the module network; from the public side it does not exist.
        location = /modules/example/mcp { return 404; }

        location = /_example_member {
            internal;
            # The subrequest carries the original's method and Content-Length: LCC's check is a GET, and the server's
            # 64k limit would refuse an upload here, which nginx reports as a 500.
            client_max_body_size 64m;
            proxy_method GET;
            proxy_pass http://lcc:8080/internal/hub/member;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ^~ /modules/example/ {
            add_header Strict-Transport-Security "max-age=31536000" always;
            auth_request /_example_member;
            auth_request_set $example_member_id $upstream_http_x_brax_member_id;
            auth_request_set $example_member_name $upstream_http_x_brax_member_name;
            auth_request_set $example_member_role $upstream_http_x_brax_member_role;
            # Uploads to the module's storage API (brax-data 7); streamed on, nothing held on disk here.
            client_max_body_size 64m;
            proxy_request_buffering off;
            set $example example;
            proxy_pass http://$example:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # WebSocket pass-through for a page that relays realtime (brax-data 7); a plain request sends no Upgrade.
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Brax-Member-Id $example_member_id;
            proxy_set_header X-Brax-Member-Name $example_member_name;
            proxy_set_header X-Brax-Member-Role $example_member_role;
            proxy_set_header X-Brax-Device-Id "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

# Needed once per http block if the hub's conf does not have it yet (it does on bridge hubs for the chat WebSocket):
#     map $http_upgrade $connection_upgrade { default upgrade; "" close; }
